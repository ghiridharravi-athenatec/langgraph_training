server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin from the browser's point of view; forwarded to the backend
    # container over the compose network. Matches frontend/src/api/client.js's
    # relative baseURL ("/api/v1").
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router — let the client-side router handle unknown paths.
    location / {
        try_files $uri /index.html;
    }
}
